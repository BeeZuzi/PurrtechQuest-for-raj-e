# Sample quest, extracted on first run so admins have a working example of the format.
# Delete this file (or edit it) once you understand the shape.

display-name: "Sběr železa"
description: "Vytěž 10 kusů železné rudy pro kováře ve vesnici."
category: mining
repeatable: false
cooldown-seconds: 0
auto-start: false
auto-turn-in: true
required-quests: []

objectives:
  - type: COLLECT_ITEM
    target: RAW_IRON
    amount: 10
    label: "Vytěž železnou rudu"

rewards:
  # "name" is what players see for the reward in the quest menu. Colors work: &e, &#FFD700 or MiniMessage.
  - type: MONEY
    amount: 50.0
    name: "&e50 mincí"
  - type: EXPERIENCE
    amount: 20
    name: "&a20 zkušeností"
