# PurrtechQuest configuration

storage:
  # SQLITE (single server, default) or MYSQL (for a network of servers sharing player quest progress).
  type: SQLITE
  sqlite-file: data.db
  # Only read when type is MYSQL. Works against MySQL and MariaDB servers.
  mysql:
    host: localhost
    port: 3306
    database: purrtechquest
    username: purrtechquest
    password: ""
    pool-size: 10
    use-ssl: false

# The language of every quest text (lang/<locale>.yml).
default-locale: cs

# false (default) - every player gets the default-locale texts above, whatever language their Minecraft
#                   client is set to.
# true            - each player gets the lang/<locale>.yml matching their client's language, falling back
#                   to default-locale when there is none.
per-player-locale: false

# Directory (relative to the plugin's data folder) where quest definition YAML files live.
quests-directory: quests

# Shows quest text in the lowercase small-caps "tiny font" (ᴋʟɪᴋɴɪ ᴘʀᴏ ᴅᴇᴛᴀɪʟʏ ǫᴜᴇsᴛᴜ).
#   true  - tiny font everywhere: the built-in menu texts and everything an admin types (quest, reward and
#           tier names, descriptions, objective labels).
#   false - normal letters: admin text is shown exactly as typed, the built-in menu texts as plain lowercase.
# Applies on /questadmin reload. A config.yml from before this option existed behaves as true.
tiny-font: true

quest-list:
  # Inventory slots the quest list menu puts quests in (0 = top-left, 53 = bottom-right of the 6-row menu).
  # A range "9-35", single slots, or both comma-separated: "10-16, 19-25, 28-34". The guide (slot 4) and the
  # navigation slots (45, 48, 50, 53) are always kept free. More quests than slots spill onto further pages.
  # Applies on /questadmin reload.
  slots: "9-35"

tracking:
  # How a player's /quest track'd objective is displayed: ACTION_BAR (default, unobtrusive) or BOSS_BAR.
  display: ACTION_BAR

# On join, lists the quests the player currently has in progress (accepted, not yet finished) in chat,
# with each objective's progress. Nothing is sent if they have none. The message text lives in
# lang/<locale>.yml under the quest.join-active-* keys; set a single line to "" to hide just that line.
# Applies on /questadmin reload.
join-summary:
  enabled: true
  # Wait this many ticks (20 = 1 second) after the player's data loads, so the message isn't buried
  # under other plugins' join messages.
  delay-ticks: 40

debug: false
