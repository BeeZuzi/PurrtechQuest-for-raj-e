# PurrtechQuest configuration

storage:
  # SQLITE (single server, default) or MYSQL (for a network of servers sharing player quest progress).
  type: SQLITE
  sqlite-file: data.db
  # Only read when type is MYSQL. Works against MySQL and MariaDB servers.
  mysql:
    host: localhost
    port: 3306
    database: purrtechquest
    username: purrtechquest
    password: ""
    pool-size: 10
    use-ssl: false

# Used when a player's client locale has no matching lang/<locale>.yml.
default-locale: cs

# Directory (relative to the plugin's data folder) where quest definition YAML files live.
quests-directory: quests

# Shows quest text in the lowercase small-caps "tiny font" (ᴋʟɪᴋɴɪ ᴘʀᴏ ᴅᴇᴛᴀɪʟʏ ǫᴜᴇsᴛᴜ).
#   true  - tiny font everywhere: the built-in menu texts and everything an admin types (quest, reward and
#           tier names, descriptions, objective labels).
#   false - normal letters: admin text is shown exactly as typed, the built-in menu texts as plain lowercase.
# Applies on /questadmin reload. A config.yml from before this option existed behaves as true.
tiny-font: true

tracking:
  # How a player's /quest track'd objective is displayed: ACTION_BAR (default, unobtrusive) or BOSS_BAR.
  display: ACTION_BAR

debug: false
